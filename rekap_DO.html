    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 999px;
    border: 1.5px solid #d1d5db; background: #fff;
    font-size: 13px; font-weight: 600; color: #374151;
    cursor: pointer; text-decoration: none;
    transition: background .15s, transform .15s, border-color .15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn-back:hover { background: #f3f4f6; border-color: #9ca3af; transform: translateY(-1px); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
    padding: 20px 22px; box-shadow: 0 2px 10px rgba(15,23,42,0.05);
  }
  .stat-card .s-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: #9ca3af; margin-bottom: 10px;
  }
  .stat-card .s-val { font-size: 34px; font-weight: 700; line-height: 1; }
  .stat-card .s-sub { font-size: 12px; color: #9ca3af; margin-top: 8px; }
  .stat-card.total .s-val { color: #111827; }
  .stat-card.ok .s-val { color: #16a34a; }
  .stat-card.wait .s-val { color: #d97706; }
  .s-bar { height: 5px; border-radius: 999px; background: #f3f4f6; margin-top: 12px; overflow: hidden; }
  .s-bar-fill { height: 100%; border-radius: 999px; }
  .stat-card.ok .s-bar-fill { background: #16a34a; }
  .stat-card.wait .s-bar-fill { background: #d97706; }

  /* Filter */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px; margin-bottom: 16px;
  }
  .filter-pill {
    padding: 8px 18px; border-radius: 999px; border: 1.5px solid #e5e7eb;
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 600;
    color: #6b7280; transition: all .15s; line-height: 1;
  }
  .filter-pill:hover { border-color: #9ca3af; color: #374151; }
  .filter-pill.active { background: #111827; color: #fff; border-color: #111827; }
  .filter-pill.f-ok.active { background: #16a34a; border-color: #16a34a; }
  .filter-pill.f-wait.active { background: #d97706; border-color: #d97706; }
  .result-info { margin-left: auto; font-size: 12px; color: #9ca3af; font-weight: 500; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 11px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap; letter-spacing: 0.02em;

  .badge.wait { background: #fef3c7; color: #92400e; }

  .table-wrap {

  td.no { color: #d1d5db; text-align: center; font-size: 12px; vertical-align: middle; }

  .item-list { display: flex; flex-direction: column; gap: 4px; }

  .item-row .iqty { color: #111827; font-weight: 600; white-space: nowrap; font-size: 12px; }

  .card-meta {

  {status:'wait', toko:'CV. Sukses Sentosa', kirim:'3 Mei 2026', resi:'SCP000000058',
   items:[['Biskuit Gandum 120gr',50],['Sambal Terasi 240gr',60],['Minyak Goreng 2L',20],['Beras Premium 5kg',30]]}
];

function render(filterType) {
  const filtered = filterType === 'all' ? data : data.filter(d => d.status === filterType);
  document.getElementById('resultInfo').textContent = 'Menampilkan ' + filtered.length + ' dari ' + data.length + ' DO';

  const tbody = document.getElementById('tbody');
  const cardList = document.getElementById('cardList');
  tbody.innerHTML = '';
  cardList.innerHTML = '';

  filtered.forEach(function(d, i) {
    const no = i + 1;
    const badge = d.status === 'ok'
      ? '<span class="badge ok">Terkirim</span>'
      : '<span class="badge wait">Belum Kirim</span>';
    const resiText = d.status === 'ok' ? d.resi : '&mdash;';
    const kirimText = d.status === 'ok' ? d.kirim : '&mdash;';
    const itemsHtml = d.items.map(function(it) {
      return '<div class="item-row"><span class="iname">' + it[0] + '</span><span class="iqty">' + it[1] + ' pcs</span></div>';
    }).join('');

    // Table row
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="no">' + no + '</td>' +
      '<td class="toko">' + d.toko + '</td>' +
      '<td class="barang"><div class="item-list">' + itemsHtml + '</div></td>' +
      '<td class="kirim">' + kirimText + '</td>' +
      '<td class="resi">' + resiText + '</td>' +
      '<td class="status">' + badge + '</td>';
    tbody.appendChild(tr);

    // Mobile card
    const card = document.createElement('div');
    card.className = 'do-card';
    card.innerHTML =
      '<div class="card-top">' +
        '<div class="left">' +
          '<span class="card-no">#' + no + '</span>' +
          '<span class="card-toko">' + d.toko + '</span>' +
        '</div>' +
        badge +
      '</div>' +
      '<div class="card-items">' + itemsHtml + '</div>' +
      '<div class="card-meta">' +
        '<span class="kirim-label">' + (d.status === 'ok' ? 'Kirim: ' + d.kirim : 'Belum ada jadwal kirim') + '</span>' +
        '<span class="resi-val">' + (d.status === 'ok' ? d.resi : '') + '</span>' +
      '</div>';
    cardList.appendChild(card);
  });
}

function setFilter(type, btn) {
  document.querySelectorAll('.filter-pill').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render(type);
}

const monthMap = {Januari:1,Februari:2,Maret:3,April:4,Mei:5,Juni:6,Juli:7,Agustus:8,September:9,Oktober:10,November:11,Desember:12};
function parseDate(str) {
  const p = str.split(' ');
  return new Date(+p[2], monthMap[p[1]] - 1, +p[0]);
}
data.sort(function(a, b) { return parseDate(a.kirim) - parseDate(b.kirim); });

render('all');
</script>
</body>
</html>
