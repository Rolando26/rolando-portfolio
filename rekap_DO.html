<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rekap Delivery Order — 28 Mei 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    color: #1f2937;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

  /* Header */
  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #111827; }
  .header .sub { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 999px;
    border: 1.5px solid #d1d5db; background: #fff;
    font-size: 13px; font-weight: 600; color: #374151;
    cursor: pointer; text-decoration: none;
    transition: background .15s, transform .15s, border-color .15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn-back:hover { background: #f3f4f6; border-color: #9ca3af; transform: translateY(-1px); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
    padding: 20px 22px; box-shadow: 0 2px 10px rgba(15,23,42,0.05);
  }
  .stat-card .s-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: #9ca3af; margin-bottom: 10px;
  }
  .stat-card .s-val { font-size: 34px; font-weight: 700; line-height: 1; }
  .stat-card .s-sub { font-size: 12px; color: #9ca3af; margin-top: 8px; }
  .stat-card.total .s-val { color: #111827; }
  .stat-card.s1 .s-val { color: #2563eb; }
  .stat-card.s2 .s-val { color: #d97706; }
  .stat-card.s3 .s-val { color: #16a34a; }
  .s-bar { height: 5px; border-radius: 999px; background: #f3f4f6; margin-top: 12px; overflow: hidden; }
  .s-bar-fill { height: 100%; border-radius: 999px; }
  .stat-card.s1 .s-bar-fill { background: #2563eb; }
  .stat-card.s2 .s-bar-fill { background: #d97706; }
  .stat-card.s3 .s-bar-fill { background: #16a34a; }

  /* Filter */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px; margin-bottom: 16px;
  }
  .filter-pill {
    padding: 8px 18px; border-radius: 999px; border: 1.5px solid #e5e7eb;
    background: #fff; cursor: pointer; font-size: 13px; font-weight: 600;
    color: #6b7280; transition: all .15s; line-height: 1;
  }
  .filter-pill:hover { border-color: #9ca3af; color: #374151; }
  .filter-pill.active { background: #111827; color: #fff; border-color: #111827; }
  .filter-pill.f-s1.active { background: #2563eb; border-color: #2563eb; }
  .filter-pill.f-s2.active { background: #d97706; border-color: #d97706; }
  .filter-pill.f-s3.active { background: #16a34a; border-color: #16a34a; }
  .result-info { margin-left: auto; font-size: 12px; color: #9ca3af; font-weight: 500; }

  /* Badge */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 11px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap; letter-spacing: 0.02em;
  }
  .badge.s1 { background: rgba(37,99,235,0.12); color: #2563eb; }
  .badge.s2 { background: #fef3c7; color: #92400e; }
  .badge.s3 { background: #dcfce7; color: #15803d; }

  /* Desktop table */
  .table-wrap {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
    overflow: hidden; box-shadow: 0 2px 14px rgba(15,23,42,0.06);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #111827; color: #f9fafb; padding: 13px 16px;
    text-align: left; font-size: 11px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap;
  }
  thead th:first-child { width: 44px; text-align: center; }
  tbody tr { border-bottom: 1px solid #f3f4f6; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  td { padding: 13px 16px; vertical-align: top; font-size: 13px; color: #374151; }
  td.no { color: #d1d5db; text-align: center; font-size: 12px; vertical-align: middle; }
  td.toko { font-weight: 700; color: #111827; min-width: 150px; vertical-align: middle; }
  td.barang { min-width: 200px; }
  .item-list { display: flex; flex-direction: column; gap: 4px; }
  .item-row { display: flex; justify-content: space-between; gap: 12px; }
  .item-row .iname { color: #374151; flex: 1; }
  .item-row .iqty { color: #111827; font-weight: 600; white-space: nowrap; font-size: 12px; }
  td.kirim { white-space: nowrap; vertical-align: middle; color: #6b7280; min-width: 105px; font-size: 12px; }
  td.resi { font-family: 'Courier New', Courier, monospace; font-size: 11px; color: #6b7280; min-width: 130px; vertical-align: middle; }
  td.status { vertical-align: middle; }

  /* Mobile cards */
  .card-list { display: none; flex-direction: column; gap: 12px; }
  .do-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
    padding: 16px 18px; box-shadow: 0 2px 10px rgba(15,23,42,0.05);
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .card-top .left { display: flex; align-items: center; gap: 8px; }
  .card-no { font-size: 11px; font-weight: 700; color: #d1d5db; }
  .card-toko { font-size: 15px; font-weight: 700; color: #111827; }
  .card-items { border-top: 1px solid #f3f4f6; padding: 10px 0; display: flex; flex-direction: column; gap: 5px; }
  .card-items .item-row { font-size: 13px; }
  .card-meta {
    border-top: 1px solid #f3f4f6; padding-top: 10px; margin-top: 2px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 6px;
  }
  .card-meta .kirim-label { font-size: 12px; color: #6b7280; }
  .card-meta .resi-val { font-family: 'Courier New', Courier, monospace; font-size: 11px; color: #9ca3af; }

  /* Responsive */
  @media (max-width: 800px) {
    .table-wrap { display: none; }
    .card-list { display: flex; }
  }
  @media (max-width: 900px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat-card .s-val { font-size: 28px; }
  }
  @media (max-width: 480px) {
    .page { padding: 14px 12px 36px; }
    .header h1 { font-size: 20px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .result-info { display: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div>
      <h1>Rekap Delivery Order</h1>
      <p class="sub">Tanggal cetak: 28 Mei 2026 &nbsp;&middot;&nbsp; Total <span id="hTotal"></span> DO</p>
    </div>
    <a href="dashboard_do.html" class="btn-back">&#8592; Dashboard</a>
  </div>

  <div class="stats">
    <div class="stat-card total">
      <div class="s-label">Total DO</div>
      <div class="s-val" id="statTotal"></div>
      <div class="s-sub">Semua pengiriman bulan ini</div>
    </div>
    <div class="stat-card s1">
      <div class="s-label">DO Dibuat</div>
      <div class="s-val" id="statS1"></div>
      <div class="s-sub" id="statS1Pct"></div>
      <div class="s-bar"><div class="s-bar-fill" id="barS1"></div></div>
    </div>
    <div class="stat-card s2">
      <div class="s-label">Surat Jalan</div>
      <div class="s-val" id="statS2"></div>
      <div class="s-sub" id="statS2Pct"></div>
      <div class="s-bar"><div class="s-bar-fill" id="barS2"></div></div>
    </div>
    <div class="stat-card s3">
      <div class="s-label">Terkirim</div>
      <div class="s-val" id="statS3"></div>
      <div class="s-sub" id="statS3Pct"></div>
      <div class="s-bar"><div class="s-bar-fill" id="barS3"></div></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="filter-pill active" id="btnAll" onclick="setFilter(0,this)">Semua</button>
    <button class="filter-pill f-s1"   id="btnS1"  onclick="setFilter(1,this)">DO Dibuat</button>
    <button class="filter-pill f-s2"   id="btnS2"  onclick="setFilter(2,this)">Surat Jalan</button>
    <button class="filter-pill f-s3"   id="btnS3"  onclick="setFilter(3,this)">Terkirim</button>
    <span class="result-info" id="resultInfo"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nama Toko</th>
          <th>Daftar Barang</th>
          <th>Tgl. Kirim</th>
          <th>No. Resi</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="card-list" id="cardList"></div>

</div>
<script>
/* ── Data generation: same logic as dashboard_do.html ── */
const _contacts = [
  'Client 11','Client 02','Client 05',
  'Client 16','Client 13','Client 03',
  'Client 10','Client 18','Client 08','Client 04'
];
const _exped = ['JNE','SiCepat','Wahana'];
const _catalog = [
  'Minyak Goreng 2L','Beras Premium 5kg','Susu UHT 1L',
  'Kopi Aromatic 150gr','Tepung Terigu 1kg','Roti Gandum',
  'Sereal Muesli 300gr','Saus Tomat 560gr','Biskuit Gandum 120gr','Sambal Terasi 240gr'
];

const data = [
  {stage:3, toko:'Client 15',     kirim:'23 Mei 2026', resi:'JNE1234567890',
   items:[['Minyak Goreng 1L',36],['Beras 5kg',24],['Sabun Mandi 80gr',120]]},
  {stage:2, toko:'Client 12',      kirim:'21 Mei 2026', resi:'SCP0987654321',
   items:[['Roti Tawar 500gr',60],['Susu UHT 1L',80],['Biskuit Cokelat 150gr',40]]},
  {stage:3, toko:'Client 01',     kirim:'19 Mei 2026', resi:'WNH3216549870',
   items:[['Sereal Box',50],['Tea Bag 50 pcs',70]]},
  {stage:1, toko:'Client 14',   kirim:'26 Mei 2026', resi:'JNE9283746501',
   items:[['Air Mineral 600ml',96],['Snack Kentang',72],['Mayones 250gr',36]]},
  {stage:3, toko:'Client 06', kirim:'24 Mei 2026', resi:'SCP5647382910',
   items:[['Minyak Kayu Putih 60ml',30],['Shampoo 330ml',55],['Tissue Basah 10 pack',45]]},
  {stage:2, toko:'Client 17',      kirim:'25 Mei 2026', resi:'WNH2917364508',
   items:[['Kopi Sachet 10pcs',120],['Gula Pasir 1kg',80],['Susu Kental Manis 370gr',50]]},
  {stage:3, toko:'Client 07',     kirim:'20 Mei 2026', resi:'JNE1122334455',
   items:[['Susu Bubuk 400gr',40],['Cokelat Batangan 100gr',90]]},
  {stage:1, toko:'Client 09',     kirim:'27 Mei 2026', resi:'SCP6677889900',
   items:[['Kecap Manis 620ml',50],['Sambal Botol 335gr',70],['Susu Cokelat 250ml',100]]},
];

for (var i = 9; i <= 58; i++) {
  var toko     = _contacts[(i - 9) % 10];
  var exp      = _exped[i % 3];
  var invDay   = (i % 27) + 1;
  var kirim    = (invDay + 1) + ' Mei 2026';
  var resi     = (exp === 'JNE' ? 'JNE' : exp === 'SiCepat' ? 'SCP' : 'WNH') + String(1000000000 + i).slice(1);
  var stage    = i % 3 === 0 ? 3 : i % 3 === 1 ? 1 : 2;
  var itemCnt  = 3 + (i % 3);
  var items    = [];
  for (var j = 0; j < itemCnt; j++) {
    items.push([_catalog[(i + j) % 10], 20 + ((i + j) % 5) * 10]);
  }
  data.push({ stage: stage, toko: toko, kirim: kirim, resi: resi, items: items });
}

/* ── Sort by shipping date ── */
const _mth = {Januari:1,Februari:2,Maret:3,April:4,Mei:5,Juni:6,Juli:7,Agustus:8,September:9,Oktober:10,November:11,Desember:12};
function parseDate(str) {
  var p = str.split(' ');
  return new Date(+p[2], _mth[p[1]] - 1, +p[0]);
}
data.sort(function(a, b) { return parseDate(a.kirim) - parseDate(b.kirim); });

/* ── Load persisted stages from localStorage ── */
try {
  var _saved = localStorage.getItem('do_stages_v1');
  if (_saved) JSON.parse(_saved).forEach(function(s, i) { if (data[i]) data[i].stage = s; });
} catch(e) {}

/* ── Init stats & button labels ── */
var cnt1  = data.filter(function(d){ return d.stage === 1; }).length;
var cnt2  = data.filter(function(d){ return d.stage === 2; }).length;
var cnt3  = data.filter(function(d){ return d.stage === 3; }).length;
var cntAll = data.length;
function pct(n) { return Math.round(n / cntAll * 100); }

document.getElementById('hTotal').textContent    = cntAll;
document.getElementById('statTotal').textContent = cntAll;
document.getElementById('statS1').textContent    = cnt1;
document.getElementById('statS2').textContent    = cnt2;
document.getElementById('statS3').textContent    = cnt3;
document.getElementById('statS1Pct').textContent = pct(cnt1) + '% dari total DO';
document.getElementById('statS2Pct').textContent = pct(cnt2) + '% dari total DO';
document.getElementById('statS3Pct').textContent = pct(cnt3) + '% dari total DO';
document.getElementById('barS1').style.width = pct(cnt1) + '%';
document.getElementById('barS2').style.width = pct(cnt2) + '%';
document.getElementById('barS3').style.width = pct(cnt3) + '%';
document.getElementById('btnAll').textContent = 'Semua (' + cntAll + ')';
document.getElementById('btnS1').textContent  = 'DO Dibuat (' + cnt1 + ')';
document.getElementById('btnS2').textContent  = 'Surat Jalan (' + cnt2 + ')';
document.getElementById('btnS3').textContent  = 'Terkirim (' + cnt3 + ')';

/* ── Render ── */
var _stageLabel = { 1:'DO Dibuat', 2:'Surat Jalan', 3:'Terkirim' };
var _stageCls   = { 1:'s1', 2:'s2', 3:'s3' };

function render(filterStage) {
  var filtered = filterStage === 0 ? data : data.filter(function(d){ return d.stage === filterStage; });
  document.getElementById('resultInfo').textContent = 'Menampilkan ' + filtered.length + ' dari ' + cntAll + ' DO';

  var tbody    = document.getElementById('tbody');
  var cardList = document.getElementById('cardList');
  tbody.innerHTML = '';
  cardList.innerHTML = '';

  filtered.forEach(function(d, i) {
    var no         = i + 1;
    var isShipped  = d.stage === 3;
    var badge      = '<span class="badge ' + _stageCls[d.stage] + '">' + _stageLabel[d.stage] + '</span>';
    var resiText   = isShipped ? d.resi : '&mdash;';
    var kirimText  = isShipped ? d.kirim : '&mdash;';
    var itemsHtml  = d.items.map(function(it){
      return '<div class="item-row"><span class="iname">' + it[0] + '</span><span class="iqty">' + it[1] + ' pcs</span></div>';
    }).join('');

    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="no">'    + no        + '</td>' +
      '<td class="toko">'  + d.toko    + '</td>' +
      '<td class="barang"><div class="item-list">' + itemsHtml + '</div></td>' +
      '<td class="kirim">' + kirimText + '</td>' +
      '<td class="resi">'  + resiText  + '</td>' +
      '<td class="status">'+ badge     + '</td>';
    tbody.appendChild(tr);

    var card = document.createElement('div');
    card.className = 'do-card';
    card.innerHTML =
      '<div class="card-top">' +
        '<div class="left"><span class="card-no">#' + no + '</span><span class="card-toko">' + d.toko + '</span></div>' +
        badge +
      '</div>' +
      '<div class="card-items">' + itemsHtml + '</div>' +
      '<div class="card-meta">' +
        '<span class="kirim-label">' + (isShipped ? 'Kirim: ' + d.kirim : 'Belum dikirim') + '</span>' +
        '<span class="resi-val">'    + (isShipped ? d.resi : '') + '</span>' +
      '</div>';
    cardList.appendChild(card);
  });
}

function setFilter(stage, btn) {
  document.querySelectorAll('.filter-pill').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render(stage);
}

render(0);
</script>
</body>
</html>
