  .page{max-width:1100px;margin:0 auto;padding:28px 20px}
  h1{font-size:22px;font-weight:600;color:#1a1a2e;margin-bottom:4px}
  .sub{color:#6b7280;font-size:13px;margin-bottom:24px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
  .stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 20px}
  .stat .label{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .stat .val{font-size:26px;font-weight:600}
  .stat.total .val{color:#1a1a2e}
  .stat.ok .val{color:#16a34a}
  .stat.wait .val{color:#d97706}

  .filter-row{display:flex;gap:10px;margin-bottom:16px}
  .filter-row button{padding:7px 18px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:13px;color:#374151;transition:all .15s}
  .filter-row button.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

  .table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{background:#1a1a2e;color:#f9fafb;padding:11px 14px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
  tbody tr{border-bottom:1px solid #f0f0f0;transition:background .1s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:#fafafa}
  td{padding:11px 14px;vertical-align:top;font-size:13px}
  td.no{color:#9ca3af;text-align:center;width:36px}
  td.toko{font-weight:600;color:#1a1a2e;min-width:160px}
  td.barang ul{list-style:none;padding:0}
  td.barang ul li{display:flex;justify-content:space-between;gap:16px;padding:2px 0;color:#374151}
  td.barang ul li span.nama{flex:1}
  td.barang ul li span.qty{color:#1a1a2e;font-weight:600;white-space:nowrap;min-width:52px;text-align:right}
  td.kirim{white-space:nowrap;color:#374151;min-width:110px}
  td.resi{font-family:monospace;font-size:12px;color:#4b5563;min-width:130px}
  td.status{white-space:nowrap}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
  .badge.ok{background:#dcfce7;color:#15803d}
  .badge.wait{background:#fef3c7;color:#92400e}

  .section-head{padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e5e7eb;font-size:12px;font-weight:600;letter-spacing:.05em;color:#6b7280;text-transform:uppercase}

  .hidden{display:none}
  @media(max-width:680px){
    .stats{grid-template-columns:1fr 1fr}
    td.resi{display:none}
    thead th:nth-child(5){display:none}
  }
</style>

let currentFilter = 'all';

function render(filter) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const filtered = filter === 'all' ? data : data.filter(d => d.status === filter);

  let no = 0;
  filtered.forEach(d => {
    no++;
    const itemsHtml = d.items.map(([nm,qty]) =>
      `<li><span class="nama">${nm}</span><span class="qty">${qty} pcs</span></li>`
    ).join('');
    const badgeHtml = d.status === 'ok'
      ? '<span class="badge ok">Terkirim</span>'
      : '<span class="badge wait">Belum Kirim</span>';
    const resiHtml = d.status === 'ok' ? d.resi : '—';
    const kiriHtml = d.status === 'ok' ? d.kirim : '—';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="no">${no}</td>
      <td class="toko">${d.toko}</td>
      <td class="barang"><ul>${itemsHtml}</ul></td>
      <td class="kirim">${kiriHtml}</td>
      <td class="resi">${resiHtml}</td>
      <td class="status">${badgeHtml}</td>
    `;
    tbody.appendChild(tr);
  });
}

function filter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-row button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(type);
}
